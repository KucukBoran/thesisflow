name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, mbstring, fileinfo
          coverage: none
      - run: find src public views bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/run.php
      - run: python3 tests/http_smoke.py
